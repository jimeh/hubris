name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  MISE_EXPERIMENTAL: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      safe_version: ${{ steps.version.outputs.safe_version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          cache_key: mise-v1-${{ github.event_name }}-release-prepare-{{platform}}-{{file_hash}}

      - id: version
        run: scripts/release-version.sh

  # Node stays on the mise.toml pin (below 24.16) because Electron Packager
  # can exit successfully without producing dist/ on newer Node. Never add a
  # setup-node step here.
  build:
    needs: prepare
    name: build (${{ matrix.component }} ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            task: build:server:linux-x64
          - component: server
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            task: build:server:linux-arm64
          - component: server
            target: x86_64-apple-darwin
            runner: macos-26-intel
            task: build:server:macos-x64
          - component: server
            target: aarch64-apple-darwin
            runner: macos-26
            task: build:server:macos-arm64
          - component: desktop
            target: x86_64-apple-darwin
            runner: macos-26-intel
            task: build:desktop:macos-x64
          - component: desktop
            target: aarch64-apple-darwin
            runner: macos-26
            task: build:desktop:macos-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          cache_key: mise-v1-${{ github.event_name }}-${{ matrix.component }}-${{ matrix.target }}-{{platform}}-{{file_hash}}

      - name: Build
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: mise run "${TASK}"

      - name: Package release asset
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "${COMPONENT}" == "desktop" ]]; then
            scripts/package-desktop-asset.sh \
              "${TARGET}" "${VERSION}" release-dist
          else
            scripts/package-server-asset.sh \
              "${TARGET}" "${VERSION}" release-dist
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.component }}-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: release-dist
          merge-multiple: true

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-dist/hubris-sbom.spdx.json
          upload-artifact: false

      - name: Generate checksums
        run: |
          (
            cd release-dist
            shasum -a 256 hubris-* > hubris-checksums.txt
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hubris-release-${{ needs.prepare.outputs.safe_version }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.prepare.outputs.is_tag == 'true'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          cache_key: mise-v1-${{ github.event_name }}-release-publish-{{platform}}-{{file_hash}}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hubris-release-${{ needs.prepare.outputs.safe_version }}
          path: release-dist

      - name: Generate artifact attestations
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-dist/hubris-*

      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" --json isDraft \
            >/tmp/hubris-release.json 2>/dev/null; then
            echo "existing_release=true" >>"${GITHUB_OUTPUT}"
          else
            echo "existing_release=false" >>"${GITHUB_OUTPUT}"
            scripts/extract-release-notes.sh \
              "${VERSION}" /tmp/hubris-release-notes.md
          fi

      - if: steps.notes.outputs.existing_release == 'false'
        name: Create draft release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --notes-file /tmp/hubris-release-notes.md

      - name: Upload release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" release-dist/* --clobber

      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${TAG}" --draft=false --verify-tag
