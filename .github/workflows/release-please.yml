name: release-please

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  # Not cancel-in-progress: this workflow creates draft releases and force-
  # creates tags, so a cancel landing between those two side effects can leave
  # a draft release with no tag (release.yml then never fires) or a tag with no
  # release. Queueing is cheap; a half-applied release is not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default GITHUB_TOKEN cannot trigger downstream workflows, so the
      # release PR and its tag are created through a GitHub App token. Both
      # RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY must be configured
      # on the repository before this workflow can run.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
