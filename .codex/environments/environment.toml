version = 1
name = "hubris"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"
cp -av "$CODEX_SOURCE_TREE_PATH/.gitnexus" .
mise setup
mise run gitnexus:analyze
'''

[[actions]]
name = "Run Web"
icon = "tool"
command = "mise dev"

[[actions]]
name = "Run Desktop"
icon = "tool"
command = "mise dev:desktop"

[[actions]]
name = "Run Web (local data)"
icon = "tool"
command = "env HUBRIS_DATA_DIR=\"./data\" mise dev"

[[actions]]
name = "Build Web"
icon = "tool"
command = "mise build"

[[actions]]
name = "Build Desktop"
icon = "tool"
command = "mise build:desktop"
