<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hubris</title>
    <script>
      // Apply cached theme before first paint to prevent FOUC.
      // Must match logic in theme store.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("hubris-appearance") || "{}");
          var scheme = s.colorScheme || "auto";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var wantDark =
            scheme === "dark" || (scheme !== "light" && prefersDark);

          var cache = JSON.parse(
            localStorage.getItem("hubris-theme-cache") || "{}",
          );
          var entry = wantDark ? cache.dark : cache.light;

          if (entry) {
            if (entry.isDark) document.documentElement.classList.add("dark");
            var vars = entry.vars;
            var style = document.documentElement.style;
            for (var key in vars) {
              if (vars.hasOwnProperty(key)) {
                style.setProperty(key, vars[key]);
              }
            }
          } else {
            // No cache — at least set dark class
            if (wantDark) document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="app" class="h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
