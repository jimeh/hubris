[tools]
rust = "latest"
bun = "latest"

[tasks.build]
depends = ["build:frontend", "build:server"]
description = "Build frontend + server (release)"

[tasks."build:frontend"]
run = "cd frontend && bun install && bun run build"
description = "Install deps and build frontend"

[tasks."build:server"]
depends = ["build:frontend"]
run = "cargo build --release"
description = "Build server binary (release)"

[tasks.dev]
description = "Print dev server instructions"
run = """
echo "Run in separate terminals:"
echo "  cd crates/server && cargo run"
echo "  cd frontend && bun dev"
"""

[tasks.check]
description = "Run type/lint checks"
run = [
  "cargo check",
  "cd frontend && bun run check",
]

[tasks.test]
description = "Run all tests"
run = [
  "cd frontend && bun run test",
  "cd crates/server && cargo test",
]

[tasks.clean]
description = "Remove build artifacts"
run = [
  "cargo clean",
  "rm -rf frontend/dist frontend/node_modules",
]
