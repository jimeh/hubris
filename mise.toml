[tools]
rust = "latest"
bun = "latest"
"github:mitsuhiko/systemfd" = "latest"
zig = "latest"
cargo-binstall = "latest"

[tasks.build]
depends = ["build:web", "build:server"]
description = "Build web app + server (release)"

[tasks."build:web"]
run = [
  "bun install",
  "bun run --filter hubris-web build",
]
description = "Install deps and build web app"

[tasks."build:server"]
depends = ["build:web"]
run = "cargo build --release --features embed-frontend"
description = "Build server binary (release)"

[tasks."build:desktop-runtime"]
run = "cargo build --release --bin hubris-desktop-runtime"
description = "Build the desktop runtime binary (release)"

[tasks."build:server:linux-x64"]
depends = ["build:web"]
run = ".mise/tasks/build-rust-target hubris-server x86_64-unknown-linux-gnu --features embed-frontend"
description = "Build the standalone server for Linux x64"

[tasks."build:server:linux-arm64"]
depends = ["build:web"]
run = ".mise/tasks/build-rust-target hubris-server aarch64-unknown-linux-gnu --features embed-frontend"
description = "Build the standalone server for Linux arm64"

[tasks."build:server:macos-x64"]
depends = ["build:web"]
run = ".mise/tasks/build-rust-target hubris-server x86_64-apple-darwin --features embed-frontend"
description = "Build the standalone server for macOS x64"

[tasks."build:server:macos-arm64"]
depends = ["build:web"]
run = ".mise/tasks/build-rust-target hubris-server aarch64-apple-darwin --features embed-frontend"
description = "Build the standalone server for macOS arm64"

[tasks."build:desktop-runtime:macos-x64"]
run = ".mise/tasks/build-rust-target hubris-desktop-runtime x86_64-apple-darwin"
description = "Build the desktop runtime for macOS x64"

[tasks."build:desktop-runtime:macos-arm64"]
run = ".mise/tasks/build-rust-target hubris-desktop-runtime aarch64-apple-darwin"
description = "Build the desktop runtime for macOS arm64"

[tasks."build:desktop"]
run = ".mise/tasks/build-desktop-native"
description = "Build the Electron desktop app"

[tasks."build:desktop:macos-x64"]
run = ".mise/tasks/build-desktop-target darwin x64 x86_64-apple-darwin"
description = "Build the Electron desktop app for macOS x64"

[tasks."build:desktop:macos-arm64"]
run = ".mise/tasks/build-desktop-target darwin arm64 aarch64-apple-darwin"
description = "Build the Electron desktop app for macOS arm64"

[tasks."dev:server"]
run = "systemfd --no-pid -s http::0 -- mise watch --restart dev:server:raw"
description = "Run backend dev server with hot reload"

[tasks."dev:server:raw"]
run = "cd apps/server && cargo run --bin hubris-server"
description = "Run backend dev server"
hide = true
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/server/Cargo.toml",
  "apps/server/build.rs",
  "apps/server/src/**/*.rs",
]

[tasks."dev:web"]
run = "bun run --filter hubris-web dev"
description = "Run web dev server"

[tasks."dev:desktop"]
run = ".mise/tasks/dev-desktop"
description = "Run the Electron desktop app in dev mode"

[tasks."check:desktop"]
run = [
  "bun run --filter hubris-desktop lint",
  "bun run --filter hubris-desktop check",
]
description = "Desktop lint + type check"

[tasks."check:backend"]
description = "Rust format check + clippy"
run = [
  "cargo fmt --all --check",
  "cargo check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks."check:web"]
run = [
  "bun run --filter hubris-web lint",
  "bun run --filter hubris-web check",
]
description = "Web lint + format check + type check"

[tasks."check:markdown"]
run = "bun x prettier --check '**/*.md' '!node_modules' '!apps/web/node_modules'"
description = "Markdown format check"

[tasks.check]
description = "Run all checks"
depends = ["check:backend", "check:web", "check:desktop", "check:markdown"]

[tasks.lint]
description = "Alias for check"
depends = ["check"]

[tasks."format:backend"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."format:web"]
run = "bun run --filter hubris-web format"
description = "Format web code"

[tasks."format:markdown"]
run = "bun x prettier --write '**/*.md' '!node_modules' '!apps/web/node_modules'"
description = "Format Markdown files"

[tasks.format]
description = "Format all code"
depends = ["format:backend", "format:web", "format:markdown"]

[tasks."test:web"]
run = [
  "bun run --filter hubris-web test",
  "bun run --filter hubris-web test:smoke",
]
description = "Run web tests"

[tasks."test:desktop"]
run = "bun run --filter hubris-desktop test"
description = "Run desktop tests"

[tasks."test:backend"]
run = "cd apps/server && cargo test"
description = "Run backend tests"

[tasks."docker:test"]
description = "Run backend + web tests in Linux via Docker"
run = [
  "docker build -f Dockerfile.test -t hubris-test .",
  '''docker run --rm \
    -v "$PWD:/work" \
    -v hubris-docker-test-cargo:/cargo \
    -v hubris-docker-test-target:/cargo-target \
    -v hubris-docker-test-sccache:/sccache \
    -v hubris-docker-test-bun-cache:/bun-cache \
    -v hubris-docker-test-node-modules:/work/node_modules \
    -e CARGO_HOME=/cargo \
    -e CARGO_TARGET_DIR=/cargo-target \
    -e HOST_UID="$(id -u)" \
    -e HOST_GID="$(id -g)" \
    -w /work \
    hubris-test''',
]

[tasks.test]
description = "Run all tests"
run = [
  "mise run test:backend",
  "mise run test:web",
  "mise run test:desktop",
]

[tasks."setup:web"]
run = "bun install"
description = "Install web dependencies"

[tasks."setup:server"]
run = "cargo fetch"
description = "Fetch backend dependencies"

[tasks.setup]
depends = ["setup:web", "setup:server"]
description = "Install all dependencies"

[tasks.generate]
description = "Run all code generators"
depends = ["generate:web"]

[tasks."generate:web"]
run = [
  "cargo run -p hubris-server --bin generate_contracts",
  "bun run --filter hubris-web generate:contracts:rest",
  "bun run --filter hubris-web generate:monaco-languages",
  "bun run --filter hubris-web generate:material-icons",
  "bun run --filter hubris-web generate:theme-defaults",
]
description = "Generate web contracts and theme defaults"

[tasks."download:fonts"]
run = "apps/web/scripts/download-bundled-fonts.sh"
description = "Download bundled Nerd Font woff2 files"

[tasks."download:vscode-themes"]
run = "bun run scripts/download-vscode-themes.ts"
description = "Download and resolve VS Code built-in themes"

[tasks."clean:web"]
run = "rm -rf apps/web/dist apps/web/node_modules apps/desktop/.vite apps/desktop/out dist node_modules"
description = "Remove web build artifacts"

[tasks.clean]
description = "Remove build artifacts"
run = [
  "cargo clean",
  "mise run clean:web",
]
