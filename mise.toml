[tools]
rust = "latest"
bun = "latest"
"cargo:tauri-cli" = "2"
"github:mitsuhiko/systemfd" = "latest"

[tasks.build]
depends = ["build:frontend", "build:server"]
description = "Build frontend + server (release)"

[tasks."build:frontend"]
run = [
  "bun install",
  "bun run --filter hubris-web build",
]
description = "Install deps and build frontend"

[tasks."build:server"]
depends = ["build:frontend"]
run = "cargo build --release --features embed-frontend"
description = "Build server binary (release)"

[tasks."build:desktop"]
run = [
  "bun install",
  "cd apps/desktop-tauri && cargo tauri build --bundles app",
]
description = "Build the Tauri desktop app"

[tasks."dev:server"]
run = "systemfd --no-pid -s http::0 -- mise watch --restart dev:server:raw"
description = "Run backend dev server with hot reload"

[tasks."dev:server:raw"]
run = "cd apps/server && cargo run --bin hubris-server"
description = "Run backend dev server"
hide = true
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "apps/server/Cargo.toml",
  "apps/server/build.rs",
  "apps/server/src/**/*.rs",
]

[tasks."dev:frontend"]
run = "bun run --filter hubris-web dev"
description = "Run frontend dev server"

[tasks."dev:desktop"]
run = ".mise/tasks/dev-desktop"
description = "Run the Tauri desktop app in dev mode"

[tasks."check:backend"]
description = "Rust format check + clippy"
run = [
  "cargo fmt --all --check",
  "cargo check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks."check:frontend"]
run = [
  "bun run --filter hubris-web lint",
  "bun run --filter hubris-web check",
]
description = "Frontend lint + format check + type check"

[tasks."check:markdown"]
run = "bun x prettier --check '**/*.md' '!node_modules' '!apps/web/node_modules'"
description = "Markdown format check"

[tasks.check]
description = "Run all checks"
depends = ["check:backend", "check:frontend", "check:markdown"]

[tasks.lint]
description = "Alias for check"
depends = ["check"]

[tasks."format:backend"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."format:frontend"]
run = "bun run --filter hubris-web format"
description = "Format frontend code"

[tasks."format:markdown"]
run = "bun x prettier --write '**/*.md' '!node_modules' '!apps/web/node_modules'"
description = "Format Markdown files"

[tasks.format]
description = "Format all code"
depends = ["format:backend", "format:frontend", "format:markdown"]

[tasks."test:frontend"]
run = [
  "bun run --filter hubris-web test",
  "bun run --filter hubris-web test:smoke",
]
description = "Run frontend tests"

[tasks."test:backend"]
run = "cd apps/server && cargo test"
description = "Run backend tests"

[tasks."docker:test"]
description = "Run backend + frontend tests in Linux via Docker"
run = [
  "docker build -f Dockerfile.test -t hubris-test .",
  '''docker run --rm \
    -v "$PWD:/work" \
    -v hubris-docker-test-cargo:/cargo \
    -v hubris-docker-test-target:/cargo-target \
    -v hubris-docker-test-sccache:/sccache \
    -v hubris-docker-test-bun-cache:/bun-cache \
    -v hubris-docker-test-node-modules:/work/node_modules \
    -e CARGO_HOME=/cargo \
    -e CARGO_TARGET_DIR=/cargo-target \
    -e HOST_UID="$(id -u)" \
    -e HOST_GID="$(id -g)" \
    -w /work \
    hubris-test''',
]

[tasks.test]
description = "Run all tests"
run = [
  "mise run test:backend",
  "mise run test:frontend",
]

[tasks."setup:frontend"]
run = "bun install"
description = "Install frontend dependencies"

[tasks."setup:server"]
run = "cargo fetch"
description = "Fetch backend dependencies"

[tasks.setup]
depends = ["setup:frontend", "setup:server"]
description = "Install all dependencies"

[tasks.generate]
description = "Run all code generators"
depends = ["generate:frontend"]

[tasks."generate:frontend"]
run = [
  "cargo run -p hubris-server --bin generate_contracts",
  "bun run --filter hubris-web generate:contracts:rest",
  "bun run --filter hubris-web generate:monaco-languages",
  "bun run --filter hubris-web generate:material-icons",
  "bun run --filter hubris-web generate:theme-defaults",
]
description = "Generate frontend contracts and theme defaults"

[tasks."download:fonts"]
run = "apps/web/scripts/download-bundled-fonts.sh"
description = "Download bundled Nerd Font woff2 files"

[tasks."download:vscode-themes"]
run = "bun run scripts/download-vscode-themes.ts"
description = "Download and resolve VS Code built-in themes"

[tasks."clean:frontend"]
run = "rm -rf apps/web/dist apps/web/node_modules node_modules"
description = "Remove frontend build artifacts"

[tasks.clean]
description = "Remove build artifacts"
run = [
  "cargo clean",
  "mise run clean:frontend",
]
